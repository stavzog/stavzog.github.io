<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>All Writings - Stavros Zografos</title>
        <link rel="stylesheet" href="/static/style.css" />
    </head>
    <body>
        <div class="site-container">
            <header>
                <a href="/" class="logo">Stavros Zografos</a>
                <button class="tailor-tab" id="tailorTab" aria-label="Toggle accent"></button>
            </header>

            <div class="article-layout">
                <nav class="back-nav">
                    <a href="/">Index</a>
                </nav>

                <div class="archive-container">
                    <header class="post-header">
                        <h1 class="post-title">All Writings</h1>
                        <div class="post-meta">Chronological Archive</div>
                    </header>

                    <div class="archive-table">
                        <div class="index-col">
                            <h4>Archive // Writings</h4>
                            <ul class="index-list">
                                {{ range .BlogPosts }}
                                <li class="index-item">
                                    <a href="/blog/{{ .Slug }}.html">
                                        <span class="title">{{ .Title }}</span>
                                        <span class="desc">Read full post.</span>
                                        <span class="meta">{{ .Date }}</span>
                                    </a>
                                </li>
                                {{ end }}
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="connect">
                <a href="https://github.com/stavzog">Github</a>
                <a href="mailto:stavzog@gmail.com">Email</a>
                <a href="https://www.linkedin.com/in/stavzog/">LinkedIn</a>
            </footer>
        </div>
        <script>
            const tab = document.getElementById('tailorTab');
            if (tab) {
                tab.addEventListener('click', () => {
                    tab.classList.toggle('clicked');
                });
            }
        </script>
    </body>
</html>
