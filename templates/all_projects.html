<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>All Projects - Stavros Zografos</title>
        <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
        <link rel="stylesheet" href="/static/style.css" />
    </head>
    <body>
        <div class="site-container">
            <header>
                <a href="/" class="logo">Stavros Zografos</a>
                <button class="tailor-tab" id="tailorTab" aria-label="Toggle accent"></button>
            </header>

            <div class="article-layout">
                <nav class="back-nav">
                    <a href="/">Index</a>
                </nav>

                <div class="archive-container">
                    <header class="post-header">
                        <h1 class="post-title">All Projects</h1>
                        <div class="post-meta">Engineering & Architecture</div>
                    </header>

                    <div class="archive-table">
                        <div class="index-col">
                            <h4>Archive // Projects</h4>
                            <ul class="index-list">
                                {{ range .Projects }}
                                <li class="index-item">
                                    <a href="/projects/{{ .Slug }}.html">
                                        <span class="title">{{ .Title }}</span>
                                        <span class="desc">View project details and architecture.</span>
                                        <span class="meta">{{ .Status }}</span>
                                    </a>
                                </li>
                                {{ end }}
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="connect">
                <a href="https://github.com/stavzog">Github</a>
                <a href="mailto:stavzog@gmail.com">Email</a>
                <a href="https://www.linkedin.com/in/stavzog/">LinkedIn</a>
            </footer>
        </div>
        <script>
            const tab = document.getElementById('tailorTab');
            if (tab) {
                tab.addEventListener('click', () => {
                    tab.classList.toggle('clicked');
                });
            }

            var colors = ['#e02875', '#002bf0', '#177a4b'];
            var random_color = colors[Math.floor(Math.random() * colors.length)];
            document.querySelectorAll('.index-item .meta').forEach((item) => {
                item.style.color = random_color;
            });
        </script>
    </body>
</html>
