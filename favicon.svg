<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- The 3-color Tailor's Triad split into exact thirds -->
    <linearGradient id="tailorStripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e02875" />
      <stop offset="33.333%" stop-color="#e02875" />
      <stop offset="33.333%" stop-color="#002bf0" />
      <stop offset="66.666%" stop-color="#002bf0" />
      <stop offset="66.666%" stop-color="#177a4b" />
      <stop offset="100%" stop-color="#177a4b" />
    </linearGradient>
  </defs>

  <!--
    EDIT HERE:
  -->
  <rect x="3" y="8" width="26" height="15"
        fill="url(#tailorStripe)"
        stroke="#121212"
        stroke-opacity="0.4"
        stroke-width="1" />
</svg>
