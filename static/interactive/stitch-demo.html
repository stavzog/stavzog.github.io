<div class="stitch-demo">
  <div class="stitch-header">
    <span class="stitch-title">BÉZIER STITCH TENSION SIMULATOR</span>
    <span class="stitch-val" id="tensionDisplay">TENSION: 0.50</span>
  </div>
  <canvas id="stitchCanvas" width="600" height="200"></canvas>
  <div class="stitch-controls">
    <label for="stitchTension">Interpolation Tension</label>
    <input type="range" id="stitchTension" min="0" max="100" value="50" />
    <button type="button" id="stitchRandomize">Randomize Points</button>
  </div>
</div>

<style>
  .stitch-demo {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
    width: 100%;
  }

  .stitch-header {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: var(--text-muted);
  }

  .stitch-demo canvas {
    background: #ffffff;
    border: 1px solid var(--line-main);
    width: 100%;
    height: 180px;
  }

  .stitch-controls {
    display: flex;
    align-items: center;
    gap: 1rem;
    font-family: var(--font-mono);
    font-size: 0.75rem;
  }

  .stitch-controls label {
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 0.72rem;
  }

  .stitch-controls input[type="range"] {
    flex: 1;
    accent-color: var(--c-cobalt);
  }
</style>

<script>
(() => {
  const canvas = document.getElementById("stitchCanvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const slider = document.getElementById("stitchTension");
  const display = document.getElementById("tensionDisplay");
  const btn = document.getElementById("stitchRandomize");

  let points = [
    { x: 50, y: 150 },
    { x: 180, y: 40 },
    { x: 320, y: 160 },
    { x: 450, y: 50 },
    { x: 550, y: 120 }
  ];

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const tension = parseFloat(slider.value) / 100;
    display.textContent = `TENSION: ${tension.toFixed(2)}`;

    // Draw grid lines
    ctx.strokeStyle = "#f0f0ee";
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
      ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 40) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(canvas.width, y);
      ctx.stroke();
    }

    // Draw control polygon
    ctx.strokeStyle = "#d0d0ce";
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // Draw smooth curve using tension
    ctx.strokeStyle = "#002bf0"; // Cobalt
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);

    for (let i = 0; i < points.length - 1; i++) {
      const p0 = i > 0 ? points[i - 1] : points[i];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = i != points.length - 2 ? points[i + 2] : p2;

      const cp1x = p1.x + (p2.x - p0.x) * tension * 0.5;
      const cp1y = p1.y + (p2.y - p0.y) * tension * 0.5;
      const cp2x = p2.x - (p3.x - p1.x) * tension * 0.5;
      const cp2y = p2.y - (p3.y - p1.y) * tension * 0.5;

      ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
    }
    ctx.stroke();

    // Draw stitch node points
    points.forEach((p, idx) => {
      ctx.fillStyle = idx === 0 || idx === points.length - 1 ? "#e02875" : "#121212";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  slider.addEventListener("input", draw);
  btn.addEventListener("click", () => {
    points = points.map((p, idx) => {
      if (idx === 0) return { x: 50, y: 100 + Math.random() * 60 };
      if (idx === points.length - 1) return { x: 550, y: 100 + Math.random() * 60 };
      return {
        x: 100 + idx * 110 + (Math.random() * 40 - 20),
        y: 40 + Math.random() * 120
      };
    });
    draw();
  });

  draw();
})();
</script>
